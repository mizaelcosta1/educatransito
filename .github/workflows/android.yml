name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test, lint and build Android APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace
      - name: Enable Android emulator hardware acceleration
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native PDF and media on Android 8.0
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/run-connected-tests.sh
      - name: Verify installable APK and record checksum
        run: |
          apk_dir=app/build/outputs/apk/debug
          cp "$apk_dir/app-debug.apk" "$apk_dir/EDUCATRANSITO-0.3.0-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk_dir/EDUCATRANSITO-0.3.0-debug.apk" > "$apk_dir/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk_dir/EDUCATRANSITO-0.3.0-debug.apk" > "$apk_dir/package.txt"
          cd "$apk_dir"
          sha256sum EDUCATRANSITO-0.3.0-debug.apk > SHA256SUMS
          cat signature.txt package.txt SHA256SUMS
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: educatransito-verification
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/lint-results-debug.*
            app/build/qa/
            app/schemas/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: educatransito-debug-apk
          path: |
            app/build/outputs/apk/debug/EDUCATRANSITO-0.3.0-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
            app/build/outputs/apk/debug/signature.txt
            app/build/outputs/apk/debug/package.txt
          if-no-files-found: error
          retention-days: 30
